<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1e" />
      <stop offset="50%" stop-color="#090814" />
      <stop offset="100%" stop-color="#05050c" />
    </linearGradient>
    <radialGradient id="tf-glow" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tf-bg)" />
  <rect width="800" height="500" fill="url(#tf-glow)" />

  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Browser Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#0d0a18" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.5" />
    <rect width="680" height="42" rx="14" fill="#151025" />
    <circle cx="25" cy="21" r="5.5" fill="#ff5f57" />
    <circle cx="45" cy="21" r="5.5" fill="#febc2e" />
    <circle cx="65" cy="21" r="5.5" fill="#28c840" />
    <rect x="95" y="10" width="360" height="22" rx="6" fill="rgba(255,255,255,0.06)" />
    <text x="110" y="25" fill="#8e8ba0" font-family="'JetBrains Mono', monospace" font-size="11">https://taskflow.yogesh.dev/boards/sprint-4</text>

    <!-- Kanban Columns -->
    <!-- Col 1: To Do -->
    <g transform="translate(25, 60)">
      <rect width="200" height="330" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
      <rect x="14" y="16" width="8" height="8" rx="4" fill="#e8512a" />
      <text x="30" y="24" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">TO DO (3)</text>
      <!-- Task 1 -->
      <rect x="12" y="42" width="176" height="74" rx="8" fill="#161226" stroke="rgba(255,255,255,0.08)" />
      <text x="22" y="62" fill="#dedee8" font-family="sans-serif" font-size="11" font-weight="bold">Refactor Auth Middleware</text>
      <text x="22" y="78" fill="#8e8ba0" font-family="sans-serif" font-size="9.5">Express REST API endpoints</text>
      <rect x="22" y="92" width="46" height="14" rx="3" fill="rgba(232,81,42,0.2)" />
      <text x="26" y="102" fill="#ff8c6a" font-family="'JetBrains Mono', monospace" font-size="8">P1 HIGH</text>
      <!-- Task 2 -->
      <rect x="12" y="126" width="176" height="74" rx="8" fill="#161226" stroke="rgba(255,255,255,0.08)" />
      <text x="22" y="146" fill="#dedee8" font-family="sans-serif" font-size="11" font-weight="bold">MongoDB Indexing</text>
      <text x="22" y="162" fill="#8e8ba0" font-family="sans-serif" font-size="9.5">Optimize task query speed</text>
      <rect x="22" y="176" width="46" height="14" rx="3" fill="rgba(139,92,246,0.2)" />
      <text x="26" y="186" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="8">BACKEND</text>
    </g>

    <!-- Col 2: In Progress -->
    <g transform="translate(240, 60)">
      <rect width="200" height="330" rx="10" fill="rgba(139,92,246,0.06)" stroke="rgba(139,92,246,0.3)" />
      <rect x="14" y="16" width="8" height="8" rx="4" fill="#8b5cf6" />
      <text x="30" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="bold">IN PROGRESS (2)</text>
      <!-- Active Task Card -->
      <rect x="12" y="42" width="176" height="100" rx="8" fill="#201838" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="22" y="64" fill="#fff" font-family="sans-serif" font-size="11.5" font-weight="bold">Realtime Status Sync</text>
      <text x="22" y="80" fill="#a78bfa" font-family="sans-serif" font-size="9.5">Optimistic UI &amp; State update</text>
      <!-- Progress Bar -->
      <rect x="22" y="94" width="156" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
      <rect x="22" y="94" width="110" height="6" rx="3" fill="#8b5cf6" />
      <rect x="22" y="112" width="55" height="16" rx="4" fill="#8b5cf6" />
      <text x="28" y="124" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="8.5">ACTIVE NOW</text>
    </g>

    <!-- Col 3: Completed -->
    <g transform="translate(455, 60)">
      <rect width="200" height="330" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" />
      <rect x="14" y="16" width="8" height="8" rx="4" fill="#22c55e" />
      <text x="30" y="24" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">COMPLETED (8)</text>
      <!-- Done Task -->
      <rect x="12" y="42" width="176" height="66" rx="8" fill="#120e20" stroke="rgba(34,197,94,0.3)" />
      <text x="22" y="62" fill="#8e8ba0" font-family="sans-serif" font-size="11">Client-Server Pipeline</text>
      <text x="22" y="78" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9">✓ Merged &amp; Verified</text>
    </g>
  </g>
</svg>