<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="win-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081414" />
      <stop offset="50%" stop-color="#050c0d" />
      <stop offset="100%" stop-color="#030708" />
    </linearGradient>
    <radialGradient id="win-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#win-bg)" />
  <rect width="800" height="500" fill="url(#win-bloom)" />

  <!-- Desktop Environment Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#04090b" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5" />
    
    <!-- Windows 11 Abstract Bloom Flower center wallpaper -->
    <circle cx="340" cy="180" r="110" fill="#0284c7" opacity="0.25" filter="blur(30px)" />
    <circle cx="370" cy="190" r="90" fill="#10b981" opacity="0.3" filter="blur(25px)" />

    <!-- Active Window (Edge Browser / React Redux) -->
    <g transform="translate(100, 50)">
      <rect width="480" height="270" rx="10" fill="#121a1d" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
      <!-- Window Titlebar -->
      <rect width="480" height="34" rx="10" fill="#182327" />
      <text x="18" y="22" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Microsoft Edge — Vercel App</text>
      <!-- Window Controls (Minimize, Maximize, Close) -->
      <rect x="420" y="10" width="10" height="1" fill="#94a3b8" />
      <rect x="440" y="10" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1" />
      <text x="460" y="20" fill="#ff5f57" font-size="13">✕</text>

      <!-- Window Body Content -->
      <g transform="translate(20, 50)">
        <rect width="440" height="190" rx="8" fill="#090f11" />
        <text x="24" y="36" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">⚡ Windows 11 React Core Engine</text>
        <text x="24" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">Redux State Tree: { activeWindow: "browser", zIndex: 12, fps: 60 }</text>
        <rect x="24" y="74" width="392" height="1" fill="rgba(255,255,255,0.06)" />
        <rect x="24" y="90" width="120" height="24" rx="6" fill="#10b981" />
        <text x="36" y="106" fill="#022c22" font-family="sans-serif" font-size="10.5" font-weight="bold">Live on Vercel ↗</text>
        <rect x="154" y="90" width="120" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="170" y="106" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Draggable UI</text>
      </g>
    </g>

    <!-- Bottom Windows 11 Taskbar -->
    <rect y="365" width="680" height="45" rx="0" fill="rgba(10, 20, 24, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Centered Taskbar Icons -->
    <g transform="translate(270, 375)">
      <!-- Start Button (Windows logo) -->
      <rect x="0" y="0" width="26" height="26" rx="6" fill="#0284c7" />
      <path d="M5 5h7v7H5z M14 5h7v7h-7z M5 14h7v7H5z M14 14h7v7h-7z" fill="#fff" />
      <!-- Search -->
      <rect x="34" y="0" width="26" height="26" rx="6" fill="rgba(255,255,255,0.06)" />
      <circle cx="47" cy="13" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none" />
      <!-- Edge Browser -->
      <rect x="68" y="0" width="26" height="26" rx="6" fill="rgba(255,255,255,0.06)" />
      <circle cx="81" cy="13" r="7" fill="#0284c7" />
      <!-- Terminal -->
      <rect x="102" y="0" width="26" height="26" rx="6" fill="#1e293b" />
      <text x="109" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">&gt;_</text>
    </g>
    <!-- Live Clock & Tray -->
    <text x="615" y="392" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">10:48 AM</text>
  </g>
</svg>