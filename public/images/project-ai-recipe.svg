<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0e12" />
      <stop offset="50%" stop-color="#14090d" />
      <stop offset="100%" stop-color="#080509" />
    </linearGradient>
    <radialGradient id="rec-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e8512a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e8512a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rec-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a161c" />
      <stop offset="100%" stop-color="#170c12" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rec-bg)" />
  <rect width="800" height="500" fill="url(#rec-glow)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Browser Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="14" fill="#110c14" stroke="rgba(232, 81, 42, 0.3)" stroke-width="1.5" />
    <!-- Browser Bar -->
    <rect width="680" height="42" rx="14" fill="#1a111b" />
    <circle cx="25" cy="21" r="5.5" fill="#ff5f57" />
    <circle cx="45" cy="21" r="5.5" fill="#febc2e" />
    <circle cx="65" cy="21" r="5.5" fill="#28c840" />
    <rect x="95" y="10" width="360" height="22" rx="6" fill="rgba(255,255,255,0.06)" />
    <text x="110" y="25" fill="#8e8ba0" font-family="'JetBrains Mono', monospace" font-size="11">https://recipe-ai.yogesh.dev/dashboard</text>
    
    <!-- App UI Mockup -->
    <!-- Left Navigation -->
    <rect x="20" y="60" width="160" height="330" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" />
    <rect x="35" y="80" width="80" height="12" rx="4" fill="#e8512a" />
    <rect x="35" y="110" width="120" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="35" y="130" width="100" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
    <rect x="35" y="150" width="110" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
    <rect x="35" y="170" width="90" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
    <rect x="35" y="340" width="130" height="32" rx="8" fill="rgba(232,81,42,0.15)" stroke="#e8512a" stroke-width="1" />
    <text x="50" y="360" fill="#e8512a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">+ NEW RECIPE</text>

    <!-- Main Content Area -->
    <!-- Search / Prompt Input -->
    <rect x="200" y="60" width="460" height="46" rx="10" fill="#1b121c" stroke="rgba(232,81,42,0.4)" stroke-width="1" />
    <text x="220" y="88" fill="#e8512a" font-family="'JetBrains Mono', monospace" font-size="13">✨ Chef AI:</text>
    <text x="310" y="88" fill="#d1cfdc" font-family="sans-serif" font-size="12">Creamy Garlic Tuscan Salmon with Asparagus...</text>

    <!-- Recipe Cards Grid in App -->
    <!-- Card 1 -->
    <g transform="translate(200, 122)">
      <rect width="220" height="268" rx="12" fill="url(#rec-card)" stroke="rgba(232, 81, 42, 0.25)" stroke-width="1" />
      <rect x="12" y="12" width="196" height="110" rx="8" fill="#2d171d" />
      <circle cx="110" cy="67" r="30" fill="#e8512a" opacity="0.3" />
      <text x="96" y="74" font-size="24">🍲</text>
      <text x="14" y="145" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">Mediterranean Bowl</text>
      <text x="14" y="165" fill="#8e8ba0" font-family="sans-serif" font-size="10.5">High Protein · 25 mins · 480 kcal</text>
      <rect x="14" y="180" width="192" height="1" fill="rgba(255,255,255,0.06)" />
      <rect x="14" y="195" width="55" height="18" rx="4" fill="rgba(232,81,42,0.2)" />
      <text x="22" y="208" fill="#e8512a" font-family="'JetBrains Mono', monospace" font-size="9">JWT AUTH</text>
      <rect x="75" y="195" width="55" height="18" rx="4" fill="rgba(255,255,255,0.06)" />
      <text x="82" y="208" fill="#8e8ba0" font-family="'JetBrains Mono', monospace" font-size="9">MONGODB</text>
      <rect x="14" y="226" width="192" height="28" rx="6" fill="#e8512a" />
      <text x="76" y="244" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">View Steps →</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(440, 122)">
      <rect width="220" height="268" rx="12" fill="url(#rec-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect x="12" y="12" width="196" height="110" rx="8" fill="#1f1118" />
      <circle cx="110" cy="67" r="30" fill="#a83232" opacity="0.2" />
      <text x="96" y="74" font-size="24">🥗</text>
      <text x="14" y="145" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">Avocado Quinoa Salad</text>
      <text x="14" y="165" fill="#8e8ba0" font-family="sans-serif" font-size="10.5">Vegan · Gluten-Free · 15 mins</text>
      <rect x="14" y="180" width="192" height="1" fill="rgba(255,255,255,0.06)" />
      <rect x="14" y="195" width="50" height="18" rx="4" fill="rgba(255,255,255,0.06)" />
      <text x="21" y="208" fill="#8e8ba0" font-family="'JetBrains Mono', monospace" font-size="9">OPENAI</text>
      <rect x="70" y="195" width="55" height="18" rx="4" fill="rgba(255,255,255,0.06)" />
      <text x="77" y="208" fill="#8e8ba0" font-family="'JetBrains Mono', monospace" font-size="9">EXPRESS</text>
      <rect x="14" y="226" width="192" height="28" rx="6" fill="#251720" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="76" y="244" fill="#d1cfdc" font-family="sans-serif" font-size="11" font-weight="bold">Saved Recipe</text>
    </g>
  </g>
</svg>