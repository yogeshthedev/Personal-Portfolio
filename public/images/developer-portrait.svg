<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich ambient radial glow for sleek minimalist depth -->
    <radialGradient id="meshGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#22272e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#12151a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="1"/>
    </radialGradient>

    <!-- Subtle warm/cool aesthetic halo accent -->
    <radialGradient id="haloAccent" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Torso minimal monochrome gradient -->
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="60%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>

    <!-- Minimalist head gradient -->
    <linearGradient id="headMinimal" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Sleek border highlight gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Minimalist Dot Grid Pattern -->
    <pattern id="minimalDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>

    <!-- Subtle blur filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- Deep canvas backdrop -->
  <rect width="400" height="450" fill="url(#meshGlow)"/>
  <rect width="400" height="450" fill="url(#minimalDots)"/>

  <!-- Aesthetic Ambient Light Orb in background -->
  <circle cx="200" cy="170" r="130" fill="url(#haloAccent)"/>
  <circle cx="200" cy="180" r="90" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Architectural Geometric Halo / Celestial rings -->
  <circle cx="200" cy="175" r="128" stroke="url(#glassBorder)" stroke-width="1" opacity="0.4" />
  <circle cx="200" cy="175" r="148" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 12" opacity="0.18" />
  
  <!-- Sleek Crosshair Orbit Markers -->
  <circle cx="200" cy="47" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="348" cy="175" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="52" cy="175" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Developer Silhouette Artwork -->
  <g id="figure-layer">
    <!-- Torso & Structured Minimalist Jacket/Overshirt -->
    <path d="M 85 450 C 95 345, 135 288, 172 274 L 228 274 C 265 288, 305 345, 315 450 Z" fill="url(#bodyGrad)"/>
    
    <!-- Clean Minimalist Lapel Lines -->
    <path d="M 172 274 L 192 370" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
    <path d="M 228 274 L 208 370" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
    <path d="M 200 274 L 200 450" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- High-neck Underlayer -->
    <path d="M 182 250 L 218 250 L 214 278 L 186 278 Z" fill="#0f1217"/>
    <path d="M 182 250 C 182 258, 218 258, 218 250" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Neck with clean geometric shadow -->
    <rect x="187" y="215" width="26" height="42" rx="5" fill="#475569" opacity="0.9"/>

    <!-- Head Contour -->
    <path d="M 158 165 C 158 112, 242 112, 242 165 C 242 208, 222 228, 200 230 C 178 228, 158 208, 158 165 Z" fill="url(#headMinimal)"/>

    <!-- Sleek Modern Hair -->
    <path d="M 153 156 C 150 102, 247 100, 247 154 C 236 112, 164 112, 153 156 Z" fill="#0b0e14"/>
    <path d="M 156 130 C 176 92, 225 92, 244 130 C 230 108, 170 108, 156 130 Z" fill="#1e2430"/>

    <!-- Minimalist Wireframe Specs / Glasses -->
    <g stroke="#ffffff" stroke-width="1.4" opacity="0.95" fill="none">
      <rect x="167" y="156" width="27" height="19" rx="5" fill="#090a0d" fill-opacity="0.75" stroke="url(#glassBorder)"/>
      <rect x="206" y="156" width="27" height="19" rx="5" fill="#090a0d" fill-opacity="0.75" stroke="url(#glassBorder)"/>
      <line x1="194" y1="165" x2="206" y2="165" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="167" y1="163" x2="157" y2="160" stroke="#94a3b8" stroke-width="1"/>
      <line x1="233" y1="163" x2="243" y2="160" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Subtle Glint on Lens -->
    <line x1="172" y1="160" x2="183" y2="171" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <line x1="211" y1="160" x2="222" y2="171" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <!-- Minimalist Studio Over-ear Headphones (Resting on neck) -->
    <path d="M 150 232 C 142 250, 149 268, 168 274" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 232 C 258 250, 251 268, 232 274" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <rect x="140" y="226" width="13" height="24" rx="5" fill="#141923" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="247" y="226" width="13" height="24" rx="5" fill="#141923" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <!-- Clean Floating Architectural Code Badges -->
  <!-- Left Floating Badge: System Architecture -->
  <g transform="translate(26, 320)">
    <rect width="108" height="34" rx="6" fill="#0d1017" fill-opacity="0.85" stroke="url(#glassBorder)" stroke-width="1"/>
    <circle cx="16" cy="17" r="3" fill="#10b981"/>
    <text x="26" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" letter-spacing="0.05em">TypeScript</text>
  </g>

  <!-- Right Floating Badge: Full-Stack Flow -->
  <g transform="translate(266, 320)">
    <rect width="108" height="34" rx="6" fill="#0d1017" fill-opacity="0.85" stroke="url(#glassBorder)" stroke-width="1"/>
    <circle cx="16" cy="17" r="3" fill="#38bdf8"/>
    <text x="26" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" letter-spacing="0.05em">React · Node</text>
  </g>

  <!-- Top Left Subtle Editorial Tag -->
  <g transform="translate(24, 28)">
    <text x="0" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.16em" text-transform="uppercase">PORTRAIT / 01</text>
  </g>

  <!-- Top Right Subtle Monogram / Coordinates -->
  <g transform="translate(376, 28)" text-anchor="end">
    <text x="0" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.12em">YM.DEV</text>
  </g>

  <!-- Minimal Corner Tick Accents (Refined Viewfinder) -->
  <path d="M 16 22 L 16 16 L 22 16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <path d="M 384 22 L 384 16 L 378 16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <path d="M 16 428 L 16 434 L 22 434" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <path d="M 384 428 L 384 434 L 378 434" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>