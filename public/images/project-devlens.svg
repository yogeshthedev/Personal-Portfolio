    <text x=34 y=132 fill=#94a3b8 font-family='JetBrains Mono', monospace font-size=11>POST /users/sync</text>
    <text x=34 y=156 fill=#94a3b8 font-family='JetBrains Mono', monospace font-size=11>PUT /stream/events</text>
    <text x=34 y=180 fill=#94a3b8 font-family='JetBrains Mono', monospace font-size=11>DEL /cache/tokens</text>

    <rect x=25 y=205 width=145 height=1 fill=rgba(255,255,255,0.06) />
    <text x=28 y=228 fill=#64748b font-family='JetBrains Mono', monospace font-size=10 font-weight=bold>PROXY STATUS</text>
    <rect x=25 y=238 width=145 height=24 rx=5 fill=rgba(16,185,129,0.1) stroke=rgba(16,185,129,0.3) />
    <text x=34 y=254 fill=#34d399 font-family='JetBrains Mono', monospace font-size=10>Express CORS Fallback: ON</text>

