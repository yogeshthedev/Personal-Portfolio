      <text x=14 y=54 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>1</text>
      <text x=32 y=54 fill=#cbd5e1 font-family='JetBrains Mono', monospace font-size=10>{</text>
      <text x=14 y=74 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>2</text>
      <text x=32 y=74 fill=#38bdf8 font-family='JetBrains Mono', monospace font-size=10>  status: success,</text>
      <text x=14 y=94 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>3</text>
      <text x=32 y=94 fill=#f59e0b font-family='JetBrains Mono', monospace font-size=10>  version: 2.4.0,</text>
      <text x=14 y=114 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>4</text>
      <text x=32 y=114 fill=#a78bfa font-family='JetBrains Mono', monospace font-size=10>  records: [</text>
      <text x=14 y=134 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>5</text>
      <text x=32 y=134 fill=#cbd5e1 font-family='JetBrains Mono', monospace font-size=10>    { id: req_892 },</text>
      <text x=14 y=154 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>6</text>
      <text x=32 y=154 fill=#cbd5e1 font-family='JetBrains Mono', monospace font-size=10>    { id: req_893 }</text>
      <text x=14 y=174 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>7</text>
      <text x=32 y=174 fill=#a78bfa font-family='JetBrains Mono', monospace font-size=10>  ]</text>
      <text x=14 y=194 fill=#64748b font-family='JetBrains Mono', monospace font-size=10>8</text>
      <text x=32 y=194 fill=#cbd5e1 font-family='JetBrains Mono', monospace font-size=10>}</text>

      <rect x=14 y=240 width=210 height=42 rx=6 fill=rgba(56,189,248,0.06) stroke=rgba(56,189,248,0.2) />
      <text x=24 y=258 fill=#e2e8f0 font-family=sans-serif font-size=10 font-weight=bold>TanStack Query Cache</text>
      <text x=24 y=272 fill=#94a3b8 font-family='JetBrains Mono', monospace font-size=9>Stale Time: 300s · Hydrated</text>
    </g>

    <!-- Panel Right: LCS Diff Viewer -->
    <g transform=translate(447, 104)>
      <rect width=238 height=300 rx=8 fill=#0a0f1d stroke=rgba(255,255,255,0.06) />
      <rect width=238 height=30 rx=8 fill=#0f172a />
      <text x=14 y=20 fill=#a78bfa font-family='JetBrains Mono', monospace font-size=10.5 font-weight=bold>LCS Diff Engine (Split View)</text>

      <rect x=10 y=44 width=218 height=20 rx=3 fill=rgba(239,68,68,0.15) />
      <text x=16 y=58 fill=#f87171 font-family='JetBrains Mono', monospace font-size=9.5>- timeout: 3000</text>

      <rect x=10 y=68 width=218 height=20 rx=3 fill=rgba(16,185,129,0.15) />
      <text x=16 y=82 fill=#34d399 font-family='JetBrains Mono', monospace font-size=9.5>+ timeout: 8000</text>

      <text x=16 y=106 fill=#64748b font-family='JetBrains Mono', monospace font-size=9.5>  retryPolicy: exponential</text>
      
      <rect x=10 y=116 width=218 height=20 rx=3 fill=rgba(16,185,129,0.15) />
      <text x=16 y=130 fill=#34d399 font-family='JetBrains Mono', monospace font-size=9.5>+ proxyFallback: true</text>

      <rect x=14 y=240 width=210 height=42 rx=6 fill=rgba(168,85,247,0.08) stroke=rgba(168,85,247,0.25) />
      <text x=24 y=258 fill=#e2e8f0 font-family=sans-serif font-size=10 font-weight=bold>Similarity Score: 94.2%</text>
      <text x=24 y=272 fill=#a78bfa font-family='JetBrains Mono', monospace font-size=9>3 insertions · 1 deletion</text>
    </g>
