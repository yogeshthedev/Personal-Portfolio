    <rect x=550 y=10 width=135 height=20 rx=4 fill=rgba(56,189,248,0.15) stroke=rgba(56,189,248,0.4) stroke-width=1 />
    <text x=560 y=24 fill=#38bdf8 font-family='JetBrains Mono', monospace font-size=10 font-weight=bold>● LCS DIFF ENGINE</text>

