<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 800 500 width=100% height=100%>
  <defs>
    <linearGradient id=dl-bg x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#0b1120 />
      <stop offset=50% stop-color=#080c18 />
      <stop offset=100% stop-color=#030712 />
    </linearGradient>
    <radialGradient id=dl-glow cx=50% cy=20% r=60%>
      <stop offset=0% stop-color=#38bdf8 stop-opacity=0.3 />
      <stop offset=100% stop-color=#38bdf8 stop-opacity=0 />
    </radialGradient>
    <linearGradient id=dl-panel x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#111827 />
      <stop offset=100% stop-color=#0b0f19 />
    </linearGradient>
  </defs>

  <rect width=800 height=500 fill=url(#dl-bg) />
  <rect width=800 height=500 fill=url(#dl-glow) />

  <g stroke=rgba(56,189,248,0.06) stroke-width=1>
    <line x1=0 y1=100 x2=800 y2=100 />
    <line x1=0 y1=200 x2=800 y2=200 />
    <line x1=0 y1=300 x2=800 y2=300 />
    <line x1=0 y1=400 x2=800 y2=400 />
    <line x1=200 y1=0 x2=200 y2=500 />
    <line x1=400 y1=0 x2=400 y2=500 />
    <line x1=600 y1=0 x2=600 y2=500 />
  </g>

  <!-- Workspace Window Frame -->
  <g transform=translate(50, 40)>
    <rect width=700 height=420 rx=12 fill=#090d16 stroke=rgba(56, 189, 248, 0.28) stroke-width=1.5 />
    
    <!-- Titlebar -->
    <rect width=700 height=40 rx=12 fill=#0f172a />
    <circle cx=24 cy=20 r=5 fill=#ef4444 />
    <circle cx=42 cy=20 r=5 fill=#f59e0b />
    <circle cx=60 cy=20 r=5 fill=#10b981 />
    
    <rect x=90 y=9 width=340 height=22 rx=6 fill=rgba(255,255,255,0.06) />
