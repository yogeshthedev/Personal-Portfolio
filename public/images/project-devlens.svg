    <rect x=202 y=60 width=56 height=26 rx=4 fill=#0284c7 />
    <text x=214 y=77 fill=#fff font-family='JetBrains Mono', monospace font-size=11 font-weight=bold>GET</text>
    <text x=268 y=78 fill=#e2e8f0 font-family='JetBrains Mono', monospace font-size=12>https://api.gateway.dev/v1/telemetry/payload</text>
    <rect x=618 y=59 width=60 height=28 rx=5 fill=#38bdf8 />
    <text x=632 y=77 fill=#080c18 font-family=sans-serif font-size=11 font-weight=bold>SEND</text>

